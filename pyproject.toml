[project]
name = "mnemo-memory"
version = "0.1.0"
description = "A persistent memory and coordination layer for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.9",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "rich>=13.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
local-ml = ["faiss-cpu>=1.9", "sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"